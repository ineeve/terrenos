name: terrenos
description: "Registo de terrenos offline com sincronização entre telemóveis."
publish_to: 'none'
version: 0.0.1+1

environment:
  sdk: ^3.13.7

dependencies:
  collection: ^1.19.1
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_riverpod: ^3.4.3
  geolocator: ^14.1.2
  go_router: ^18.1.1
  intl: ^0.20.3
  latlong2: ^0.10.1
  meta: ^1.19.0
  path: ^1.9.1
  path_provider: ^2.1.6
  permission_handler: ^12.0.3
  proj4dart: ^3.0.0
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  glados: ^1.1.7
  integration_test:
    sdk: flutter
  # Reads the CAOP GeoPackage in tool/build_caop.dart; not part of the app.
  sqlite3: ^2.9.4
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/caop/caop.json
