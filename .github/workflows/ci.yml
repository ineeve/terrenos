name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with README.md.
  FLUTTER_VERSION: 3.47.8

jobs:
  checks:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed $(git ls-files '*.dart')
      - name: Analyze
        run: flutter analyze
      - name: Translations complete (PT and EN)
        run: dart run tool/check_arb.dart
      - name: No copyleft dependencies
        run: dart run tool/check_licenses.dart
      - name: Tests
        run: flutter test --coverage
      - name: Coverage targets
        run: dart run tool/check_coverage.dart

  build:
    name: Build dev APK
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter build apk --debug --flavor dev
      - uses: actions/upload-artifact@v4
        with:
          name: terrenos-dev-debug
          path: build/app/outputs/flutter-apk/app-dev-debug.apk
          retention-days: 14

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
